<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Camera Live Preview</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      font-family: 'Consolas', 'Courier New', monospace;
    }
    .video-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0d13;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror view for natural camera feedback */
    }
    .hud-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(11, 13, 19, 0.85);
      border: 1px solid #00ffcc;
      color: #00ffcc;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 4px;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
      pointer-events: none;
    }
    .pip-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }
    .btn-pip {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(0, 255, 204, 0.2);
      border: 1px solid #00ffcc;
      color: #00ffcc;
      padding: 6px 12px;
      font-size: 11px;
      font-family: inherit;
      border-radius: 4px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.2s;
    }
    .btn-pip:hover {
      background: #00ffcc;
      color: #0b0d13;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.5);
    }
  </style>
</head>
<body>
  <div class="video-container">
    <video id="previewVideo" autoplay playsinline muted></video>
    <div class="hud-badge">
      <span class="pip-dot"></span>
      <span>CAM ON AIR</span>
    </div>
    <button class="btn-pip" id="btnPip" title="ลอยหน้าต่างกล้องทับทุกหน้าจอ">⧉ ลอยหน้าต่าง (PiP)</button>
  </div>

  <script src="camera-preview.js"></script>
</body>
</html>
