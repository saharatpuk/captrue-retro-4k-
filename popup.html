<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captrue Retro 4K</title>
  <style>
    :root {
      --neon-green: #22c55e;
      --laser-green: #4ade80;
      --glow-green: #00ff66;
      --dark-terminal: #050a07;
      --dark-card: #0c1510;
      --border-green: rgba(34, 197, 94, 0.25);
      --text-green: #dcfce7;
      --text-muted: #86efac;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "JetBrains Mono", "Courier New", Consolas, monospace, -apple-system, sans-serif;
    }
    body {
      width: 350px;
      background-color: var(--dark-terminal);
      color: var(--text-green);
      padding: 16px;
      user-select: none;
      position: relative;
    }
    /* CRT subtle scanline */
    body::before {
      content: " ";
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 100;
      pointer-events: none;
      opacity: 0.6;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-green);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      box-shadow: 0 0 14px rgba(34, 197, 94, 0.4);
      border: 1px solid var(--neon-green);
      object-fit: cover;
    }
    .brand-info {
      display: flex;
      flex-direction: column;
    }
    .brand-name {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--laser-green);
      text-shadow: 0 0 10px rgba(34, 197, 94, 0.6);
      line-height: 1.2;
    }
    .tag-4k {
      display: inline-block;
      align-self: flex-start;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid var(--neon-green);
      color: var(--laser-green);
      font-size: 9px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      margin-top: 3px;
    }
    .items-link {
      background: rgba(34, 197, 94, 0.08);
      border: 1px solid var(--border-green);
      color: var(--laser-green);
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .items-link:hover {
      background: rgba(34, 197, 94, 0.2);
      border-color: var(--neon-green);
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.3);
    }
    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #4ade80;
      margin-bottom: 8px;
      font-weight: 800;
      opacity: 0.8;
    }
    .control-group {
      background: var(--dark-card);
      border: 1px solid var(--border-green);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
    }
    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }
    .form-row:not(:last-child) {
      border-bottom: 1px solid rgba(34, 197, 94, 0.1);
    }
    .label-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #86efac;
      font-weight: 600;
    }
    .label-icon {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .label-icon svg {
      width: 14px;
      height: 14px;
      fill: var(--neon-green);
    }
    select {
      background: #050a07;
      color: var(--laser-green);
      border: 1px solid var(--border-green);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 11px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      font-family: inherit;
    }
    select:focus {
      border-color: var(--neon-green);
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.4);
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #1a2e22;
      border: 1px solid var(--border-green);
      transition: .3s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 2px;
      bottom: 2px;
      background-color: #4ade80;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background: rgba(34, 197, 94, 0.3);
      border-color: var(--neon-green);
    }
    input:checked + .slider:before {
      transform: translateX(18px);
      background-color: #00ff66;
      box-shadow: 0 0 8px #00ff66;
    }
    
    .btn-record {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid var(--neon-green);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.25s;
      font-family: inherit;
    }
    .btn-start {
      background: linear-gradient(180deg, #15803d 0%, #166534 100%);
      color: #f0fdf4;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
      text-shadow: 0 0 8px rgba(0, 255, 102, 0.8);
    }
    .btn-start:hover {
      background: linear-gradient(180deg, #16a34a 0%, #15803d 100%);
      box-shadow: 0 0 28px rgba(34, 197, 94, 0.7);
      transform: translateY(-1px);
    }
    .btn-stop {
      background: rgba(220, 38, 38, 0.2);
      color: #f87171;
      border: 1px solid #ef4444;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
    }
    .btn-stop:hover {
      background: rgba(220, 38, 38, 0.35);
    }
    
    .recording-status {
      display: none;
      margin-bottom: 16px;
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }
    .pulse-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #ef4444;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 1.4s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 6px #ef4444); }
      100% { transform: scale(0.9); opacity: 0.8; }
    }
    .timer {
      font-size: 19px;
      font-weight: 800;
      color: #f87171;
      text-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
    }
    .status-text {
      font-size: 11px;
      color: #fca5a5;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/icon48.png" alt="Logo" class="brand-logo">
      <div class="brand-info">
        <span class="brand-name">Captrue Retro</span>
        <span class="tag-4k">CYBER 4K</span>
      </div>
    </div>
    <button class="items-link" id="btnOpenItems" title="เปิดคลังวิดีโอ (My Terminal Items)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
      My Items
    </button>
  </div>

  <div class="recording-status" id="recordingStatus">
    <div><span class="pulse-dot"></span><span class="timer" id="timerText">00:00:00</span></div>
    <div class="status-text">&gt; CAPTURING SCREEN STREAM...</div>
  </div>

  <div id="controlsArea">
    <div class="section-title">&gt; CONFIGURATION</div>
    <div class="control-group">
      <div class="form-row">
        <div class="label-group">
          <div class="label-icon">
            <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
          </div>
          <span>ความละเอียด</span>
        </div>
        <select id="resolutionSelect">
          <option value="4k" selected>4K (3840 x 2160)</option>
          <option value="2k">2K (2560 x 1440)</option>
          <option value="1080p">1080p (Full HD)</option>
        </select>
      </div>

      <div class="form-row">
        <div class="label-group">
          <div class="label-icon">
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
          </div>
          <span>ไมโครโฟน</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="micToggle" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="form-row" id="micDeviceRow" style="display: none;">
        <div class="label-group">
          <div class="label-icon">
            <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          </div>
          <span>เลือกไมค์ (Microphone)</span>
        </div>
        <select id="micDeviceSelect">
          <option value="">กำลังค้นหาไมโครโฟน...</option>
        </select>
      </div>

      <div class="form-row">
        <div class="label-group">
          <div class="label-icon">
            <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
          </div>
          <span>กล้องหน้า (Webcam PiP)</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="camToggle">
          <span class="slider"></span>
        </label>
      </div>

      <div class="form-row" id="camDeviceRow" style="display: none;">
        <div class="label-group">
          <div class="label-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
          </div>
          <span>เลือกกล้อง (Camera)</span>
        </div>
        <select id="camDeviceSelect">
          <option value="">กำลังค้นหากล้อง...</option>
        </select>
      </div>

      <div class="form-row" id="camPositionRow" style="display: none;">
        <div class="label-group">
          <div class="label-icon">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM13 13h5v5h-5z"/></svg>
          </div>
          <span>ตำแหน่งมุมกล้อง</span>
        </div>
        <select id="camPositionSelect">
          <option value="bottom-right" selected>ขวาล่าง (Bottom Right)</option>
          <option value="bottom-left">ซ้ายล่าง (Bottom Left)</option>
          <option value="top-right">ขวาบน (Top Right)</option>
          <option value="top-left">ซ้ายบน (Top Left)</option>
        </select>
      </div>

      <div class="form-row">
        <div class="label-group">
          <div class="label-icon">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          </div>
          <span>เสียงระบบ / คอม</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="systemAudioToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <button class="btn-record btn-start" id="btnToggleRecord">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
    <span id="btnText">&gt; START RECORDING</span>
  </button>

  <script src="popup.js"></script>
</body>
</html>
